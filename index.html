<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nimo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080c;
    --card:#0b1017;
    --border:#18222f;
    --text:#fff;
    --muted:#7d8896;
    --blue:#3b9dff;
    --blue2:#1f6fe0;
    --tint:#0e2140;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{
    font-family:'Outfit',system-ui,sans-serif;
    background:radial-gradient(520px 220px at 50% -60px, rgba(59,157,255,.16), transparent 70%), var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:22px 12px calc(24px + env(safe-area-inset-bottom));
  }
  body.withtabs{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- group list ---------- */
  .head{display:flex;align-items:center;gap:12px;padding:0 4px;margin-bottom:16px}
  .logo{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(59,157,255,.6))}
  .titles h1{font-size:21px;font-weight:700;line-height:1.1}
  .titles p{font-size:13px;color:var(--muted);margin-top:2px}

  .list{display:flex;flex-direction:column;gap:10px}
  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:12px 14px;cursor:pointer;
    transition:transform .12s,border-color .12s;
  }
  .row:active{transform:scale(.985);border-color:var(--blue)}
  .gav,.pav{
    border-radius:50%;flex:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--blue);background:var(--tint);
  }
  .gav{width:44px;height:44px;font-size:17px}
  .pav{width:26px;height:26px;font-size:12px}
  .gav img,.pav img{width:100%;height:100%;object-fit:cover;display:block}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{font-size:13px;color:var(--muted)}
  .chev{width:16px;height:16px;color:var(--muted);flex:none}

  .empty{
    text-align:center;color:var(--muted);font-size:14px;line-height:1.5;
    background:var(--card);border:1px dashed var(--border);
    border-radius:16px;padding:28px 20px;
  }
  .empty button{
    margin-top:16px;border:0;border-radius:999px;padding:11px 22px;
    font-family:inherit;font-size:14px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
  }

  /* ---------- group dashboard ---------- */
  .topbar{position:relative;display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}
  .topbar h1{font-size:24px;font-weight:700}
  .pill{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    background:var(--card);border:1px solid #1d3a63;
    padding:5px 8px 5px 5px;border-radius:999px;
    box-shadow:0 0 18px rgba(59,157,255,.12);
  }
  .pill span{font-size:14px;font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .dd{
    width:20px;height:20px;border-radius:50%;background:var(--tint);color:var(--blue);
    display:flex;align-items:center;justify-content:center;
  }
  .pill .dd svg{width:12px;height:12px}

  .menu{
    position:absolute;right:0;top:calc(100% - 6px);z-index:20;min-width:210px;
    background:#0b1118;border:1px solid #1d3a63;border-radius:16px;padding:6px;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
  }
  .menu .mi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;cursor:pointer}
  .menu .mi.sel{background:var(--tint)}
  .menu .mi b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .cards{display:flex;flex-direction:column;gap:12px}
  .card{
    display:flex;align-items:center;gap:16px;
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:18px;cursor:pointer;
    transition:transform .12s,border-color .12s;
  }
  .card:active{transform:scale(.985)}
  .card.hl{
    border-color:#2a6fc4;
    background:linear-gradient(135deg,rgba(59,157,255,.20),rgba(31,111,224,.06) 60%),var(--card);
    box-shadow:0 0 24px rgba(59,157,255,.10);
  }
  .ibox{
    width:50px;height:50px;border-radius:14px;flex:none;
    background:#121a24;color:#e8eef7;
    display:flex;align-items:center;justify-content:center;
  }
  .card.hl .ibox{background:rgba(59,157,255,.22);color:var(--blue)}
  .ibox svg{width:24px;height:24px}
  .card b{display:block;font-size:18px;font-weight:600}
  .card small{display:block;font-size:14px;color:var(--muted);margin-top:3px}

  /* ---------- bottom tabs ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    background:rgba(8,11,17,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:#8b95a3;font-size:11px;font-weight:600;cursor:pointer;padding:4px 0;
  }
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--blue)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;
    background:#0f2140;border:1px solid var(--blue);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;
    transition:all .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

  <!-- ===== VIEW 1: pick a group ===== -->
  <div id="viewList" class="view">
    <div class="head">
      <img class="logo" src="nimo.png" alt="Nimo">
      <div class="titles">
        <h1>Giveaways</h1>
        <p>Pick a group to manage</p>
      </div>
    </div>
    <div id="list" class="list"></div>
  </div>

  <!-- ===== VIEW 2: group dashboard ===== -->
  <div id="viewGroup" class="view" hidden>
    <div class="topbar">
      <h1>Giveaways</h1>
      <div class="switch">
        <div class="pill" id="pill">
          <span id="pillName"></span>
          <div class="dd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
        </div>
        <div class="menu" id="menu" hidden></div>
      </div>
    </div>

    <div class="cards">
      <div class="card hl">
        <div class="ibox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/></svg></div>
        <div><b>Create giveaway</b><small>Launch a new one in seconds</small></div>
      </div>
      <div class="card">
        <div class="ibox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></div>
        <div><b>My giveaways</b><small>View, manage, sort by status</small></div>
      </div>
      <div class="card">
        <div class="ibox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
        <div><b>Templates</b><small>Browse giveaway card designs</small></div>
      </div>
      <div class="card">
        <div class="ibox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg></div>
        <div><b>Hosts</b><small>Track who sponsors giveaways</small></div>
      </div>
    </div>
  </div>

  <!-- ===== bottom tab bar (group view only) ===== -->
  <nav class="tabs" id="tabs" hidden>
    <div class="tab on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
      Giveaways
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      Moderation
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      Engagement
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      Community
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      Settings
    </div>
  </nav>

  <div id="toast" class="toast">Coming soon ✨</div>

<script>
  const REPO = 'controldealbot-a11y/nimo-app';

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  try{ tg.setHeaderColor('#06080c'); tg.setBackgroundColor('#06080c'); }catch(e){}

  const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;

  // ---- snapshot the bot packed into the URL (?d=...), used as instant first paint ----
  function readSnapshot(){
    try{
      const raw = new URLSearchParams(location.search).get('d');
      if(!raw) return null;
      let b64 = raw.replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length % 4) b64 += '=';
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }catch(e){ return null; }
  }

  const snap      = readSnapshot();
  const botUn     = snap && snap.b;
  const viewList  = document.getElementById('viewList');
  const viewGroup = document.getElementById('viewGroup');
  const tabs      = document.getElementById('tabs');
  const list      = document.getElementById('list');
  const toast     = document.getElementById('toast');
  const pill      = document.getElementById('pill');
  const pillName  = document.getElementById('pillName');
  const menu      = document.getElementById('menu');

  let groups  = [];
  let current = null;

  function showToast(){
    try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function avatarEl(g, cls){
    const av = document.createElement('div');
    av.className = cls;
    av.textContent = (Array.from(g.t || '?')[0] || '?').toUpperCase();
    if(g.p){
      const img = new Image();
      img.onload = () => { av.textContent = ''; av.appendChild(img); };
      img.src = g.p;
    }
    return av;
  }

  // ---- switching between the two screens ----
  function show(view){
    viewList.hidden  = view !== 'list';
    viewGroup.hidden = view !== 'group';
    tabs.hidden      = view !== 'group';
    document.body.classList.toggle('withtabs', view === 'group');
    closeMenu();
    window.scrollTo(0, 0);
    try{ view === 'group' ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){}
  }
  try{ tg.BackButton.onClick(() => show('list')); }catch(e){}

  function openGroup(g){
    current = g;
    fillPill();
    show('group');
  }

  // ---- group pill + dropdown ----
  function fillPill(){
    pill.querySelector('.pav')?.remove();
    pill.prepend(avatarEl(current, 'pav'));
    pillName.textContent = current.t;
  }

  function closeMenu(){ menu.hidden = true; }

  function buildMenu(){
    menu.innerHTML = '';
    groups.forEach(g => {
      const it = document.createElement('div');
      it.className = 'mi' + (current && g.id === current.id ? ' sel' : '');
      const b = document.createElement('b');
      b.textContent = g.t;
      it.append(avatarEl(g, 'pav'), b);
      it.addEventListener('click', e => { e.stopPropagation(); openGroup(g); });
      menu.appendChild(it);
    });
  }

  pill.addEventListener('click', e => {
    e.stopPropagation();
    if(menu.hidden){ buildMenu(); menu.hidden = false; } else closeMenu();
  });
  document.addEventListener('click', e => { if(!e.target.closest('.switch')) closeMenu(); });

  // everything inside the dashboard is a placeholder for now
  document.querySelectorAll('.card, .tab:not(.on)').forEach(el => el.addEventListener('click', showToast));

  // ---- group list ----
  const chevSvg = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  function render(arr){
    groups = arr;
    list.innerHTML = '';

    if(arr.length){
      arr.forEach(g => {
        const row = document.createElement('div');
        row.className = 'row';

        const info = document.createElement('div');
        info.className = 'info';
        const b = document.createElement('b');
        b.textContent = g.t;
        const s = document.createElement('small');
        s.textContent = 'Admin';
        info.append(b, s);

        row.append(avatarEl(g, 'gav'), info);
        row.insertAdjacentHTML('beforeend', chevSvg);
        row.addEventListener('click', () => openGroup(g));
        list.appendChild(row);
      });
      return;
    }

    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = (snap || tgUser)
      ? 'No groups yet. Add the bot to a group where you are an admin, send a message there, and give it a couple of minutes.'
      : 'Open this app from the bot in Telegram to load your groups.';
    if(botUn){
      const btn = document.createElement('button');
      btn.textContent = 'Add Nimo to a group';
      btn.onclick = () => tg.openTelegramLink('https://t.me/' + botUn + '?startgroup=true');
      e.appendChild(document.createElement('br'));
      e.appendChild(btn);
    }
    list.appendChild(e);
  }

  // first paint from the snapshot, then fetch the live list every time the app opens
  render((snap && snap.g) || []);

  async function refresh(){
    if(!tgUser) return;
    try{
      const r = await fetch(
        'https://api.github.com/repos/' + REPO + '/contents/data/' + tgUser.id + '.json?t=' + Date.now(),
        { headers: { 'Accept': 'application/vnd.github.raw+json' }, cache: 'no-store' }
      );
      if(!r.ok) return;
      const j = await r.json();
      render(j.g || []);
    }catch(e){}
  }
  refresh();
</script>
</body>
</html>
